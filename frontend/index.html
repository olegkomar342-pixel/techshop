<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShop — каталог</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="container catalog">
      <aside class="sidebar panel">
        <h3>Санаттар</h3>
        <ul class="cat-list" id="categories"><li class="muted small">Жүктелуде...</li></ul>

        <form id="filters">
          <h3>Баға, ₸</h3>
          <div class="row field">
            <input type="number" name="min_price" placeholder="бастап" min="0" step="1000" aria-label="Ең төменгі баға">
            <input type="number" name="max_price" placeholder="дейін" min="0" step="1000" aria-label="Ең жоғары баға">
          </div>
          <div class="field">
            <label class="checkbox"><input type="checkbox" name="in_stock" value="1"> Тек қоймада барлары</label>
          </div>
          <button class="btn block" type="submit">Қолдану</button>
          <button class="btn ghost block" type="button" id="reset-filters">Сүзгілерді тазалау</button>
        </form>
      </aside>

      <section>
        <div class="toolbar">
          <h1 id="catalog-title" style="margin:0">Барлық тауарлар</h1>
          <select id="sort" aria-label="Сұрыптау">
            <option value="newest">Жаңалары</option>
            <option value="price_asc">Алдымен арзандары</option>
            <option value="price_desc">Алдымен қымбаттары</option>
            <option value="rating">Рейтинг бойынша</option>
            <option value="name">Атауы бойынша</option>
          </select>
        </div>
        <p class="muted small" id="result-info"></p>
        <div class="grid" id="products"><div class="loading">Жүктелуде...</div></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
